[workspace]
resolver = "2"
members = ["crates/dw-core", "crates/dw-win", "crates/dw-probe"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# No panic = "abort": the DLL lives inside the game, so a bug must be caught
# (catch_unwind) and logged instead of taking the game down.
[profile.release]
lto = true
