<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Dragonwilds Trainer</title>
  <desc id="d">Open source single-player trainer for RuneScape: Dragonwilds, with its in-game panel of eight switches.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1311"/>
      <stop offset="1" stop-color="#1b140f"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.82" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#ff7a2f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moss" cx="0.08" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#3f7d5a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3f7d5a" stop-opacity="0"/>
    </radialGradient>
    <g id="on">
      <rect width="18" height="18" rx="4" fill="#e0782f"/>
      <path d="M4.5 9.5l3 3 6-7" fill="none" stroke="#1b140f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="off"><rect x="0.75" y="0.75" width="16.5" height="16.5" rx="4" fill="none" stroke="#6b5f52" stroke-width="1.5"/></g>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#moss)"/>
  <rect width="1280" height="420" fill="url(#ember)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="72" y="92" width="318" height="30" rx="15" fill="none" stroke="#4d6b57" stroke-width="1.2"/>
    <text x="231" y="112" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="2" fill="#8fc0a1">OPEN SOURCE · RUST · SOLO</text>
    <text x="70" y="196" font-size="66" font-weight="700" fill="#f3ede4" letter-spacing="-1">Dragonwilds Trainer</text>
    <text x="72" y="244" font-size="24" fill="#c3b7a6">An in-game panel for RuneScape: Dragonwilds</text>
    <text x="72" y="280" font-size="19" fill="#8f8577">Press Esc · eight switches · English &amp; Português</text>
    <text x="72" y="368" font-size="14" fill="#6f675c">Unofficial fan project. Not endorsed by or affiliated with Jagex.</text>

    <rect x="1180" y="22" width="44" height="44" rx="8" fill="#2a221b" stroke="#e0782f" stroke-width="1.5"/>
    <text x="1202" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#f3ede4">DW</text>

    <rect x="806" y="80" width="418" height="312" rx="10" fill="#15120f" fill-opacity="0.96" stroke="#3a3127"/>
    <path d="M806 90a10 10 0 0 1 10-10h398a10 10 0 0 1 10 10v26H806z" fill="#231c16"/>
    <text x="826" y="104" font-size="15" font-weight="600" fill="#e9e1d5">Dragonwilds Trainer</text>
    <g font-size="15" fill="#d9cfc1">
      <use href="#on" x="828" y="130"/><text x="858" y="144">Free runes</text>
      <use href="#on" x="828" y="158"/><text x="858" y="172">No cooldown</text>
      <use href="#on" x="828" y="186"/><text x="858" y="200">Full slots (last backpack row, ammo)</text>
      <use href="#off" x="828" y="214"/><text x="858" y="228" fill="#a39888">Infinite health</text>
      <use href="#on" x="828" y="242"/><text x="858" y="256">Infinite stamina</text>
      <use href="#on" x="828" y="270"/><text x="858" y="284">Infinite special charge</text>
      <use href="#off" x="828" y="298"/><text x="858" y="312" fill="#a39888">One hit (any weapon or spell)</text>
      <use href="#on" x="828" y="326"/><text x="858" y="340">Zero weight</text>
    </g>
    <line x1="826" y1="356" x2="1204" y2="356" stroke="#3a3127"/>
    <text x="828" y="377" font-size="13" fill="#7d7366">Player found</text>
  </g>
</svg>
